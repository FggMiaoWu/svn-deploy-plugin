# SVN 部署工具项目级配置
# 本文件由插件首次使用时自动创建，请按当前项目实际情况修改。
# 相对路径基于项目根目录解析。

# 项目根目录（可使用 ${project.root} 占位符，插件会自动替换为实际路径）
project.root=${project.root}

# 源码目录（相对于项目根目录）
src.dir=src/main

# 源码目录前缀（编译目录可能不需要该前缀，如 java/webapp/resources）
src.ignore.Prefix=java,webapp,resources

# 编译输出目录（相对于项目根目录）
build.dir=target/workorder12345/WEB-INF/classes

# Web 资源目录（相对于项目根目录，存放 JSP 等文件）
web.dir=target/workorder12345

# 部署文件输出目录（相对于项目根目录）
deploy.dir=A_compoes/localfile

# 测试环境目录（Linux 服务器路径）
test.dir=/mnt/tomcat/tomcat7_workorder_25500/webapps/workorder12345

# 生产环境目录（Linux 服务器路径）
production.dir=/mnt/tomcat/tomcat7_workorder_25100/webapps/workorder12345

# 功能模板目录（本地路径，可按需修改；留空则使用默认值）
function.source.dir=/Users/Admin/work/需求文档/模板/源文件
function.compile.dir=/Users/Admin/work/需求文档/模板/上线发布文件
function.backup.dir=/Users/Admin/work/需求文档/模板/正式环境文件备份(上线前)

# SVN 忽略文件模式（分号分隔，支持 ** 通配）
svn.ignore.files=**/*.tmp;**/*.bak;**/*.log;**/*.properties;**/log4j2.xml;**/web.xml;**/spring-*.xml;**/generator/**;**/aliyun/**

# ===== 上线申请表自动生成相关配置（以下均可按需修改） =====

# 当前需求基础目录：模板目录结构参考
# 部署时按「上线时间(YYYY-MM-DD)+功能名称」在其父目录下新建需求目录（结构同模板）
# 内 源文件/上线发布文件/正式环境文件备份(上线前) 三个子目录 + 相关文档/海口12345平台系统功能上线申请表.docx
# （申请单位/联系人/开发单位/配合单位等信息已内置在模板中，无需配置）
function.dir=/Users/Admin/work/需求文档/模板

# 申请表输出目录；留空则回退到用户主目录
form.output.dir=
